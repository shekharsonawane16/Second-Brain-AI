<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Second Brain AI</title>
    <meta name="theme-color" content="#080B12" />
    <link rel="icon" href="/icons/favicon-32.png" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: radial-gradient(1200px 600px at 50% -10%, #241a56 0%, #080b12 55%);
        color: #e7eaf3; padding: 24px;
      }
      .card {
        max-width: 380px; text-align: center; padding: 32px 28px;
        background: rgba(20, 25, 40, .72); border: 1px solid rgba(120, 130, 170, .22);
        border-radius: 20px; box-shadow: 0 20px 60px rgba(0, 0, 0, .45);
      }
      img { width: 64px; height: 64px; border-radius: 16px; margin-bottom: 16px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { margin: 0 0 20px; font-size: 14px; line-height: 1.5; color: #9aa3bb; }
      a {
        display: inline-block; padding: 10px 20px; border-radius: 10px;
        background: #5b5bf5; color: #fff; font-size: 14px; font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon-192.png" alt="Second Brain AI" />
      <h1>You're offline</h1>
      <p>Second Brain AI can't reach the network right now. Your last loaded data is still here — reconnect and try again.</p>
      <a href="/">Retry</a>
    </div>
  </body>
</html>
